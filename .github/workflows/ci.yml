name: Quality checks

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python tests and marketplace package
    runs-on: windows-latest
    defaults:
      run:
        working-directory: plugins/agent-switchboard
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: plugins/agent-switchboard/uv.lock
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -v
      - name: Validate marketplace package
        working-directory: .
        run: python scripts/validate_marketplace.py

  ui:
    name: UI bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/agent-switchboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugins/agent-switchboard/package-lock.json
      - run: npm ci
      - run: npm run build:ui
      - name: Ensure the committed UI bundle is current
        run: git diff --exit-code -- agent_switchboard/ui_bundle.js