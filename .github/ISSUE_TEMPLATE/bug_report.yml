name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Remove personal paths, configuration values, and credentials from screenshots or logs."
  - type: input
    id: version
    attributes:
      label: Plugin and Codex versions
      placeholder: "Agent Switchboard 0.1.0; Codex ..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, scope, and Agent type. Do not include raw config files or unredacted logs.